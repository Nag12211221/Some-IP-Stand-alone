<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="1" stop-color="#0A0B10"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80D8FF"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="url(#bg)"/>
  <text x="460" y="32" fill="#80D8FF" font-size="20" font-weight="600" text-anchor="middle">
    SOME/IP Diagnostics Suite — end-to-end workflow
  </text>

  <!-- Input column -->
  <g transform="translate(40,80)">
    <rect width="200" height="80" rx="8" fill="#1A1A1F" stroke="#333"/>
    <text x="100" y="30" fill="#FFD180" font-size="14" font-weight="600" text-anchor="middle">Inputs</text>
    <text x="100" y="52" fill="#E6E6E6" font-size="12" text-anchor="middle">.pcap / .pcapng file</text>
    <text x="100" y="68" fill="#E6E6E6" font-size="12" text-anchor="middle">Live NIC (Npcap / AF_PACKET)</text>
  </g>
  <g transform="translate(40,180)">
    <rect width="200" height="60" rx="8" fill="#1A1A1F" stroke="#333"/>
    <text x="100" y="25" fill="#FFD180" font-size="14" font-weight="600" text-anchor="middle">Synthetic generator</text>
    <text x="100" y="46" fill="#E6E6E6" font-size="12" text-anchor="middle">testdata/large_realistic.pcap</text>
  </g>

  <!-- Decoder -->
  <g transform="translate(310,120)">
    <rect width="220" height="120" rx="10" fill="#11283A" stroke="#80D8FF" stroke-width="1.5"/>
    <text x="110" y="28" fill="#80D8FF" font-size="14" font-weight="600" text-anchor="middle">Capture decoder</text>
    <text x="110" y="50" fill="#E6E6E6" font-size="11" text-anchor="middle">Ethernet / VLAN / IPv4 / IPv6</text>
    <text x="110" y="66" fill="#E6E6E6" font-size="11" text-anchor="middle">UDP + TCP reassembler</text>
    <text x="110" y="82" fill="#E6E6E6" font-size="11" text-anchor="middle">SOME/IP &amp; SOME/IP-SD parsers</text>
    <text x="110" y="98" fill="#E6E6E6" font-size="11" text-anchor="middle">DoIP frame parser</text>
  </g>

  <!-- Analyzers -->
  <g transform="translate(600,60)">
    <rect width="280" height="80" rx="10" fill="#1A1A1F" stroke="#FFD54F"/>
    <text x="140" y="28" fill="#FFD54F" font-size="14" font-weight="600" text-anchor="middle">SD Analyzer</text>
    <text x="140" y="50" fill="#E6E6E6" font-size="11" text-anchor="middle">Per-ECU INITIAL / REPETITION /</text>
    <text x="140" y="66" fill="#E6E6E6" font-size="11" text-anchor="middle">CYCLIC timing vs AUTOSAR PRS R21-11</text>
  </g>
  <g transform="translate(600,160)">
    <rect width="280" height="80" rx="10" fill="#1A1A1F" stroke="#A5D6A7"/>
    <text x="140" y="28" fill="#A5D6A7" font-size="14" font-weight="600" text-anchor="middle">DoIP Analyzer</text>
    <text x="140" y="50" fill="#E6E6E6" font-size="11" text-anchor="middle">RoutingActivation, AliveCheck,</text>
    <text x="140" y="66" fill="#E6E6E6" font-size="11" text-anchor="middle">UDS RTT, NRCs, retransmits, reconnects</text>
  </g>
  <g transform="translate(600,260)">
    <rect width="280" height="80" rx="10" fill="#1A1A1F" stroke="#EF9A9A"/>
    <text x="140" y="28" fill="#EF9A9A" font-size="14" font-weight="600" text-anchor="middle">Filter Engine</text>
    <text x="140" y="50" fill="#E6E6E6" font-size="11" text-anchor="middle">Compiled O(1) hash-lookup pipeline</text>
    <text x="140" y="66" fill="#E6E6E6" font-size="11" text-anchor="middle">Hit counters &amp; sparkline</text>
  </g>

  <!-- Outputs -->
  <g transform="translate(340,310)">
    <rect width="200" height="60" rx="8" fill="#1A1A1F" stroke="#333"/>
    <text x="100" y="25" fill="#FFD180" font-size="14" font-weight="600" text-anchor="middle">HTML report</text>
    <text x="100" y="46" fill="#E6E6E6" font-size="11" text-anchor="middle">--report out.html</text>
  </g>
  <g transform="translate(340,390)">
    <rect width="200" height="50" rx="8" fill="#1A1A1F" stroke="#333"/>
    <text x="100" y="22" fill="#FFD180" font-size="14" font-weight="600" text-anchor="middle">JSON summary</text>
    <text x="100" y="40" fill="#E6E6E6" font-size="11" text-anchor="middle">--json out.json</text>
  </g>

  <!-- Arrows -->
  <line x1="240" y1="120" x2="310" y2="160" stroke="#80D8FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="210" x2="310" y2="200" stroke="#80D8FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="150" x2="600" y2="100" stroke="#80D8FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="180" x2="600" y2="200" stroke="#80D8FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="220" x2="600" y2="300" stroke="#80D8FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="120" x2="540" y2="320" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="600" y1="200" x2="540" y2="340" stroke="#A5D6A7" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <line x1="440" y1="370" x2="440" y2="390" stroke="#FFD180" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
