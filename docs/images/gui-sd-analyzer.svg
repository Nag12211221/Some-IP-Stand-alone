<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Roboto, sans-serif">
  <rect width="900" height="540" fill="#0E0E11"/>
  <rect x="20" y="20" width="860" height="500" rx="6" fill="#15171E" stroke="#2A2A33"/>
  <rect x="20" y="20" width="860" height="28" rx="6" fill="#1F2129"/>
  <circle cx="38" cy="34" r="5" fill="#EF5350"/>
  <circle cx="54" cy="34" r="5" fill="#FFCA28"/>
  <circle cx="70" cy="34" r="5" fill="#66BB6A"/>
  <text x="450" y="38" fill="#E6E6E6" font-size="12" text-anchor="middle">SOME/IP Diagnostics Suite — SD Analyzer</text>

  <!-- Tabs row -->
  <g font-size="11">
    <rect x="30" y="58" width="80" height="26" rx="4" fill="#2A2D38"/>
    <text x="70" y="75" fill="#9E9E9E" text-anchor="middle">Dashboard</text>
    <rect x="115" y="58" width="80" height="26" rx="4" fill="#2A2D38"/>
    <text x="155" y="75" fill="#9E9E9E" text-anchor="middle">Capture</text>
    <rect x="200" y="58" width="100" height="26" rx="4" fill="#11283A" stroke="#80D8FF"/>
    <text x="250" y="75" fill="#80D8FF" text-anchor="middle">SD Analyzer</text>
    <rect x="305" y="58" width="100" height="26" rx="4" fill="#2A2D38"/>
    <text x="355" y="75" fill="#9E9E9E" text-anchor="middle">DoIP Analyzer</text>
  </g>

  <!-- KPI strip -->
  <g transform="translate(30,100)" font-size="11">
    <rect width="120" height="60" rx="6" fill="#1A1A1F" stroke="#333"/>
    <text x="60" y="22" fill="#80D8FF" font-size="22" font-weight="600" text-anchor="middle">10</text>
    <text x="60" y="48" fill="#9E9E9E" text-anchor="middle">ECUs</text>

    <rect x="130" width="120" height="60" rx="6" fill="#1A1A1F" stroke="#333"/>
    <text x="190" y="22" fill="#80D8FF" font-size="22" font-weight="600" text-anchor="middle">7</text>
    <text x="190" y="48" fill="#9E9E9E" text-anchor="middle">Services</text>

    <rect x="260" width="120" height="60" rx="6" fill="#1A1A1F" stroke="#333"/>
    <text x="320" y="22" fill="#80D8FF" font-size="22" font-weight="600" text-anchor="middle">1,835</text>
    <text x="320" y="48" fill="#9E9E9E" text-anchor="middle">OfferService</text>

    <rect x="390" width="120" height="60" rx="6" fill="#1A1A1F" stroke="#333"/>
    <text x="450" y="22" fill="#80D8FF" font-size="22" font-weight="600" text-anchor="middle">2</text>
    <text x="450" y="48" fill="#9E9E9E" text-anchor="middle">FindService</text>

    <rect x="520" width="120" height="60" rx="6" fill="#1A1A1F" stroke="#EF9A9A"/>
    <text x="580" y="22" fill="#EF9A9A" font-size="22" font-weight="600" text-anchor="middle">1</text>
    <text x="580" y="48" fill="#9E9E9E" text-anchor="middle">Violation</text>

    <rect x="700" y="15" width="160" height="30" rx="4" fill="#80D8FF"/>
    <text x="780" y="34" fill="#000" font-size="12" font-weight="600" text-anchor="middle">▶  Re-analyse  F5</text>
  </g>

  <!-- Per-ECU timing table -->
  <text x="30" y="190" fill="#FFD180" font-size="13" font-weight="600">Per-ECU × service timing</text>
  <g transform="translate(30,200)">
    <rect width="840" height="160" fill="#0E0F15" stroke="#222"/>
    <rect width="840" height="22" fill="#1A1A1F"/>
    <g fill="#80D8FF" font-size="11" font-weight="600">
      <text x="10"  y="15">ECU</text>
      <text x="120" y="15">Service</text>
      <text x="220" y="15">Inst</text>
      <text x="280" y="15">First offer (ms)</text>
      <text x="420" y="15">Rep base (ms)</text>
      <text x="560" y="15">Cyclic (ms)</text>
      <text x="690" y="15">Offers</text>
      <text x="770" y="15">First frame</text>
    </g>
    <g font-size="11" fill="#E6E6E6" font-family="Consolas, monospace">
      <text x="10" y="38">10.0.0.10</text><text x="120" y="38">0x1001</text><text x="220" y="38">1</text><text x="280" y="38">50.0</text><text x="420" y="38">200.0</text><text x="560" y="38">2000.0</text><text x="690" y="38">305</text><text x="770" y="38">1</text>
      <text x="10" y="58">10.0.0.11</text><text x="120" y="58">0x1002</text><text x="220" y="58">1</text><text x="280" y="58">80.0</text><text x="420" y="58">200.0</text><text x="560" y="58">2000.0</text><text x="690" y="58">305</text><text x="770" y="58">2</text>
      <text x="10" y="78">10.0.0.12</text><text x="120" y="78">0x1010</text><text x="220" y="78">1</text><text x="280" y="78">120.0</text><text x="420" y="78">200.0</text><text x="560" y="78">2000.0</text><text x="690" y="78">305</text><text x="770" y="78">3</text>
      <text x="10" y="98">10.0.0.13</text><text x="120" y="98">0x2001</text><text x="220" y="98">1</text><text x="280" y="98">150.0</text><text x="420" y="98">200.0</text><text x="560" y="98">2000.0</text><text x="690" y="98">305</text><text x="770" y="98">4</text>
      <text x="10" y="118">10.0.0.14</text><text x="120" y="118">0x2010</text><text x="220" y="118">2</text><text x="280" y="118">180.0</text><text x="420" y="118">200.0</text><text x="560" y="118">2000.0</text><text x="690" y="118">305</text><text x="770" y="118">5</text>
      <text x="10" y="138">10.0.0.15</text><text x="120" y="138">0x3000</text><text x="220" y="138">1</text><text x="280" y="138">200.0</text><text x="420" y="138">200.0</text><text x="560" y="138">2000.0</text><text x="690" y="138">305</text><text x="770" y="138">6</text>
      <text x="10" y="155" fill="#EF9A9A">10.0.0.99</text><text x="120" y="155" fill="#EF9A9A">0x9999</text><text x="220" y="155" fill="#EF9A9A">1</text><text x="280" y="155" fill="#EF9A9A">300.0</text><text x="420" y="155" fill="#EF9A9A">200.0 ⚠</text><text x="560" y="155" fill="#EF9A9A">—</text><text x="690" y="155" fill="#EF9A9A">5</text><text x="770" y="155" fill="#EF9A9A">33</text>
    </g>
  </g>

  <!-- Violations -->
  <text x="30" y="385" fill="#EF9A9A" font-size="13" font-weight="600">SD violations</text>
  <g transform="translate(30,395)">
    <rect width="840" height="100" fill="#0E0F15" stroke="#222"/>
    <rect width="840" height="22" fill="#1A1A1F"/>
    <g fill="#80D8FF" font-size="11" font-weight="600">
      <text x="10"  y="15">Kind</text>
      <text x="240" y="15">ECU</text>
      <text x="360" y="15">Service</text>
      <text x="460" y="15">Frame</text>
      <text x="540" y="15">Detail</text>
    </g>
    <g font-size="11">
      <text x="10"  y="45" fill="#EF9A9A" font-weight="600">missing-exponential-backoff</text>
      <text x="240" y="45" fill="#E6E6E6">10.0.0.99</text>
      <text x="360" y="45" fill="#E6E6E6" font-family="Consolas, monospace">0x9999.1</text>
      <text x="460" y="45" fill="#E6E6E6">33</text>
      <text x="540" y="45" fill="#E6E6E6" font-size="10">repetition gap #2 = 200 ms did not double the previous 200 ms</text>
    </g>
  </g>
</svg>
