<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11131A"/>
      <stop offset="1" stop-color="#0A0B10"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#80D8FF"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="url(#bg3)"/>
  <text x="500" y="36" fill="#80D8FF" font-size="20" font-weight="600" text-anchor="middle">Problem → Solution → Outcome</text>
  <text x="500" y="56" fill="#9E9E9E" font-size="12" text-anchor="middle">Why SOME/IP Diagnostics Suite exists and what it gives the team</text>

  <!-- Problem column -->
  <g transform="translate(40,90)">
    <rect width="290" height="290" rx="10" fill="#1A1014" stroke="#EF9A9A" stroke-width="1.3"/>
    <text x="145" y="30" fill="#EF9A9A" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">PROBLEM</text>
    <line x1="20" y1="44" x2="270" y2="44" stroke="#EF9A9A" opacity="0.35"/>
    <g font-size="12" fill="#E6E6E6">
      <text x="20" y="70">• Wireshark dissectors stop at the wire;</text>
      <text x="30" y="86">no AUTOSAR-aware timing analysis.</text>
      <text x="20" y="110">• SOME/IP-SD start-up windows are</text>
      <text x="30" y="126">easy to break, hard to spot manually.</text>
      <text x="20" y="150">• DoIP / UDS sessions span thousands</text>
      <text x="30" y="166">of frames; NRCs and retransmits</text>
      <text x="30" y="182">are buried in noise.</text>
      <text x="20" y="206">• Commercial tooling is expensive,</text>
      <text x="30" y="222">licence-locked, hard to put in CI.</text>
      <text x="20" y="246">• No standard, shareable artifact</text>
      <text x="30" y="262">for "is the bus healthy?".</text>
    </g>
  </g>

  <!-- Arrow -->
  <line x1="330" y1="235" x2="365" y2="235" stroke="#80D8FF" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Solution column -->
  <g transform="translate(370,90)">
    <rect width="290" height="290" rx="10" fill="#0E1A24" stroke="#80D8FF" stroke-width="1.3"/>
    <text x="145" y="30" fill="#80D8FF" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">SOLUTION</text>
    <line x1="20" y1="44" x2="270" y2="44" stroke="#80D8FF" opacity="0.35"/>
    <g font-size="12" fill="#E6E6E6">
      <text x="20" y="70">• Single Windows .exe (~10 MB)</text>
      <text x="30" y="86">— no installer, no Python.</text>
      <text x="20" y="110">• Native SOME/IP, SOME/IP-SD and</text>
      <text x="30" y="126">DoIP decoders + TCP reassembler.</text>
      <text x="20" y="150">• AUTOSAR PRS R21-11 timing checks</text>
      <text x="30" y="166">recover INITIAL_DELAY,</text>
      <text x="30" y="182">REPETITIONS_BASE_DELAY, CYCLIC.</text>
      <text x="20" y="206">• ISO 13400-2 state machine for</text>
      <text x="30" y="222">routing, alive-check, UDS, NRCs.</text>
      <text x="20" y="246">• GUI for engineers, CLI for CI;</text>
      <text x="30" y="262">single self-contained HTML report.</text>
    </g>
  </g>

  <line x1="660" y1="235" x2="695" y2="235" stroke="#A5D6A7" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Outcome column -->
  <g transform="translate(700,90)">
    <rect width="290" height="290" rx="10" fill="#0E1A12" stroke="#A5D6A7" stroke-width="1.3"/>
    <text x="145" y="30" fill="#A5D6A7" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">OUTCOME</text>
    <line x1="20" y1="44" x2="270" y2="44" stroke="#A5D6A7" opacity="0.35"/>
    <g font-size="12" fill="#E6E6E6">
      <text x="20" y="70">• Boot-timing violations caught in</text>
      <text x="30" y="86">seconds, with offending frame #.</text>
      <text x="20" y="110">• Every NRC, retransmit and</text>
      <text x="30" y="126">reconnect tabulated per session.</text>
      <text x="20" y="150">• Reproducible test data — same</text>
      <text x="30" y="166">numbers on every machine.</text>
      <text x="20" y="190">• --strict exit code 2 turns the</text>
      <text x="30" y="206">tool into a CI gate.</text>
      <text x="20" y="230">• Self-contained HTML report ready</text>
      <text x="30" y="246">to attach to Jira / PR / e-mail.</text>
      <text x="20" y="270">• Zero licence cost, MIT-friendly.</text>
    </g>
  </g>
</svg>
