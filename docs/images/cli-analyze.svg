<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Consolas, Courier New, monospace">
  <rect width="900" height="360" fill="#0E0E11"/>
  <rect x="20" y="20" width="860" height="320" rx="6" fill="#0A0B10" stroke="#2A2A33"/>
  <rect x="20" y="20" width="860" height="28" rx="6" fill="#1F2129"/>
  <circle cx="38" cy="34" r="5" fill="#EF5350"/>
  <circle cx="54" cy="34" r="5" fill="#FFCA28"/>
  <circle cx="70" cy="34" r="5" fill="#66BB6A"/>
  <text x="450" y="38" fill="#E6E6E6" font-size="12" text-anchor="middle">Command Prompt — analyze testdata/large_realistic.pcap</text>

  <g font-size="13" fill="#E6E6E6">
    <text x="35" y="70" fill="#A5D6A7">PS C:\repo&gt;</text>
    <text x="135" y="70">python -m someip_suite analyze testdata/large_realistic.pcap \</text>
    <text x="155" y="90">--report testdata/sample_report.html \</text>
    <text x="155" y="110">--json   testdata/sample_summary.json</text>

    <text x="35" y="145">analysed 12,575 messages from 12,894 frames in 188 ms</text>
    <text x="35" y="165" fill="#80D8FF">  SD:   ECUs=10  services=7  offers=1835  finds=2  </text><text x="540" y="165" fill="#EF9A9A">violations=1</text>
    <text x="35" y="185" fill="#80D8FF">  DoIP: sessions=6  reconnects=0  uds=3505  </text><text x="495" y="185" fill="#EF9A9A">NRCs=254</text><text x="585" y="185" fill="#FFD54F">  retx=2</text><text x="660" y="185" fill="#80D8FF">  avg_rtt_ms=3.328</text>
    <text x="35" y="205" fill="#A5D6A7">  → HTML report written to testdata/sample_report.html</text>
    <text x="35" y="225" fill="#A5D6A7">  → JSON summary written to testdata/sample_summary.json</text>

    <text x="35" y="260" fill="#A5D6A7">PS C:\repo&gt;</text>
    <text x="135" y="260">start testdata\sample_report.html   # open in browser</text>

    <text x="35" y="300" fill="#9E9E9E" font-size="11">Exit code: 0  (use --strict to exit 2 on any SD violation, useful in CI)</text>
  </g>
</svg>
