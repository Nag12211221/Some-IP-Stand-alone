<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="cov2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1408"/>
      <stop offset="0.55" stop-color="#3A2A11"/>
      <stop offset="1" stop-color="#0A0B10"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD180"/>
      <stop offset="1" stop-color="#F57F17"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" fill="url(#cov2)"/>
  <rect x="0" y="0" width="6" height="260" fill="url(#bar2)"/>

  <g stroke="#2A2218" stroke-width="0.5" opacity="0.6">
    <path d="M0 60 H1000 M0 120 H1000 M0 180 H1000 M0 240 H1000"/>
    <path d="M120 0 V260 M240 0 V260 M360 0 V260 M480 0 V260 M600 0 V260 M720 0 V260 M840 0 V260 M960 0 V260"/>
  </g>

  <g transform="translate(40,40)">
    <rect width="170" height="22" rx="11" fill="#3A2A11" stroke="#FFD180"/>
    <text x="85" y="15" fill="#FFD180" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      TEST DATA HANDBOOK
    </text>
  </g>

  <text x="40" y="110" fill="#FFFFFF" font-size="34" font-weight="700">Test Data &amp; Output Review</text>
  <text x="40" y="146" fill="#FFD180" font-size="20" font-weight="500">How to run the bundled capture and read the report</text>
  <text x="40" y="180" fill="#9E9E9E" font-size="13">
    A reproducible, deterministic walk-through from <tspan fill="#E6E6E6">large_realistic.pcap</tspan> to the HTML / JSON outputs you can ship.
  </text>

  <g transform="translate(40,210)" font-size="11" fill="#9E9E9E">
    <rect x="0" y="0" width="190" height="30" rx="4" fill="#1A1A1F" stroke="#2A2A33"/>
    <text x="12" y="19">Input: <tspan fill="#E6E6E6">large_realistic.pcap</tspan></text>

    <rect x="200" y="0" width="170" height="30" rx="4" fill="#1A1A1F" stroke="#2A2A33"/>
    <text x="212" y="19">Size: <tspan fill="#E6E6E6">~1.1 MB / 13 k frames</tspan></text>

    <rect x="380" y="0" width="170" height="30" rx="4" fill="#1A1A1F" stroke="#2A2A33"/>
    <text x="392" y="19">Outputs: <tspan fill="#E6E6E6">HTML + JSON</tspan></text>

    <rect x="560" y="0" width="160" height="30" rx="4" fill="#1A1A1F" stroke="#2A2A33"/>
    <text x="572" y="19">Mode: <tspan fill="#E6E6E6">Deterministic</tspan></text>
  </g>

  <g transform="translate(820,60)" opacity="0.9">
    <rect x="0" y="0" width="140" height="140" rx="14" fill="#241B0E" stroke="#FFD180" stroke-width="1.2"/>
    <text x="70" y="34" fill="#FFD180" font-size="11" text-anchor="middle" font-weight="600">OUTPUTS</text>
    <g transform="translate(20,46)" font-size="10" fill="#E6E6E6">
      <rect width="100" height="18" rx="3" fill="#3A2A11"/>
      <text x="50" y="13" text-anchor="middle">sample_report.html</text>
      <rect y="22" width="100" height="18" rx="3" fill="#3A2A11"/>
      <text x="50" y="35" text-anchor="middle">sample_summary.json</text>
      <rect y="44" width="100" height="18" rx="3" fill="#3A2A11"/>
      <text x="50" y="57" text-anchor="middle">CI exit code</text>
      <rect y="66" width="100" height="18" rx="3" fill="#3A2A11"/>
      <text x="50" y="79" text-anchor="middle">GUI tables</text>
    </g>
  </g>
</svg>
